services:
  aws-quick2api:
    # Option A (local build): keep `build: .`
    # Option B (prebuilt multi-arch GHCR image): comment out `build: .` and uncomment the line below
    # image: ghcr.io/kuk-888/aws-quick2api:latest
    build: .
    container_name: aws-quick2api
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3456:3456"
    # Note: Do NOT use `env_file: [.env]` here — Docker passes env_file entries via Linux execve
    # environment variables (128KB per-var limit), which breaks startup with 60+ OAuth accounts.
    # Instead, mount `./.env:/app/.env` below and let the Node gateway read `/app/.env` directly.
    environment:
      # Override HOST to 0.0.0.0 inside container so host port mapping works
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      ENV_FILE_PATH: "/app/.env"
    volumes:
      # Mount .env for initial bootstrap/static config (can even be mounted `:ro` — runtime pool state,
      # OAuth refresh-token rotations, sub-keys, model toggles & ledger all persist atomically inside `/app/data`).
      - ./.env:/app/.env
      - ./data:/app/data
